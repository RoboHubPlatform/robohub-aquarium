# What the aquarium go-server target has that the toolchain's built-in one does
# not. The files, the kind, the router and the output folders are the built-in
# target's.

targets:
  - id: go-server
    api:
      public_paths: "/, /expenses, /scheduler, /api/scheduler, /widgets, /api/widgets"
    middleware:
      # A form posted from another origin is refused before anything else:
      # keeper and the other applications are other ports of the same host,
      # which a SameSite cookie does not tell apart. Programs that post here
      # send no browser headers and are not affected.
      - name: same_origin
      - name: auth
        options:
          issuer: keeper
          skip_paths: "/healthz,/auth/login,/assets,/assets/,/i18n,/auth/callback,/static,/ui,/docs"
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
    # Every file under templates/ is a template, named by its file name.
    templates:
      - dir: templates
