# The target band of each water parameter, by kind of tank: what a new tank of
# that kind starts with, and what a test is compared with. Each tank's own
# bands are changed on its Targets tab.
types:
  planted:
    label: Planted
    temperature: 24.5-26
    ph: 6.5-7.2
    kh: 3-6
    gh: 4-12
    no3: 5-25
    no2: 0-0.1
    nh3: 0-0.02
    po4: 0.5-2
  community:
    label: Community
    temperature: 24-26
    ph: 6.8-7.8
    kh: 4-8
    gh: 6-14
    no3: 0-40
    no2: 0-0.1
    nh3: 0-0.02
    po4: 0-1
  reef:
    label: Reef
    temperature: 25-26.5
    ph: 8.1-8.4
    kh: 7-11
    no3: 2-10
    no2: 0-0.05
    nh3: 0-0.01
    po4: 0.03-0.1
  pond:
    label: Pond
    temperature: 10-24
    ph: 7-8.5
    kh: 4-10
    gh: 8-16
    no3: 0-50
    no2: 0-0.2
    nh3: 0-0.05
    po4: 0-1
