<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{ ui_head }}}
{{{ htmx }}}
<title>{{ title }} — RoboHub Aquarium</title>
{{{ forms_style }}}
{{{ widgets_style }}}
<style>
  /* What only the aquarium's pages have; the look itself is robohub.ui's. */
  .rh-main { padding: 1.1rem 1.3rem 2rem; display: grid; gap: 1rem; align-content: start; min-width: 0; }
  .ph h1 { margin: 0; }
  .ph p { margin: .2rem 0 0; }
  .rh-card.wide { display: block; }
  .app-chip { display: inline-flex; align-items: center; gap: .4rem; font: 600 .72rem/1 var(--sans); padding: .32rem .6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .app-chip::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--teal); }
  .app-chip.mode::before { background: var(--gold); }
  form.inline { display: inline-flex; margin: 0; }
  .aq-hero { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); padding: 1.3rem 1.4rem; display: grid; gap: .25rem;
    background: linear-gradient(90deg, color-mix(in srgb, var(--surface) 94%, transparent) 0%, color-mix(in srgb, var(--surface) 72%, transparent) 45%, color-mix(in srgb, var(--surface) 20%, transparent) 100%), url("/static/aquarium-background.jpg") center / cover; }
  .aq-hero h1 { margin: 0; }
  .aq-hero p { margin: 0; max-width: 60ch; }
  .readings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; margin-top: .8rem; max-width: 46rem; }
  .reading { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .75rem; }
  .reading .k { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
  .reading .v { font: 500 1.45rem/1.2 var(--serif); color: var(--gold); }
  .reading .v small { font: .74rem var(--sans); color: var(--muted); margin-left: .2rem; }
  .reading .s { font-size: .72rem; color: var(--teal); }
  .reading .s.w { color: var(--warn); }
  .aq-cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1rem; }
  .aq-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; display: grid; gap: .5rem; align-content: start; min-width: 0; }
  .aq-card h2 { font-size: 1.02rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .aq-card h2 a { font: 600 .74rem var(--sans); }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; align-items: center; padding: .45rem 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .t { font-weight: 600; }
  .row .d { font-size: .76rem; color: var(--faint); }
  .badge { font: 700 .6rem/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: .25rem .4rem; border-radius: 5px; background: var(--wash); color: var(--muted); border: 1px solid var(--line); }
  .badge.auto { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
  .badge.due { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .badge.low { color: var(--stop); border-color: var(--stop); background: var(--stop-soft); }
  .rh button.sw { width: 2.4rem; height: 1.35rem; min-height: 0; border-radius: 999px; background: var(--line-strong); color: transparent; position: relative; border: 0; box-shadow: none; cursor: pointer; padding: 0; }
  .rh button.sw::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: .95rem; height: .95rem; border-radius: 50%; background: var(--faint); transition: left .15s; }
  .rh button.sw.on { background: var(--teal-soft); box-shadow: inset 0 0 0 1px var(--teal); }
  .rh button.sw.on::after { left: 1.25rem; background: var(--teal); }
  svg.chart { width: 100%; height: 90px; display: block; }
  .rh svg.spark { width: 90px; height: 20px; display: inline-block; }
  .note, .hint { font-size: .78rem; color: var(--faint); }
  .ev { display: grid; grid-template-columns: 3.2rem 1fr; gap: .5rem; font-size: .84rem; padding: .3rem 0; border-top: 1px solid var(--line); }
  .ev:first-of-type { border-top: 0; }
  .ev time { color: var(--faint); font-family: var(--mono); font-size: .76rem; }
  .ev .warning { color: var(--warn); } .ev .error { color: var(--stop); }
  td.aq-in { color: var(--teal); } td.aq-out { color: var(--warn); font-weight: 600; }
  td.num, .num { text-align: right; white-space: nowrap; }
  .aq-form { display: grid; gap: .6rem; }
  .aq-form.inline-form { grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); align-items: end; margin-bottom: 1rem; }
  .aq-form.grid-form { grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: end; }
  .aq-form label { display: grid; gap: .2rem; font-size: .76rem; color: var(--faint); }
  .aq-form label.check { display: flex; align-items: center; gap: .4rem; }
  tr.sel td { background: var(--gold-soft); }
  .aq-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; }
  .aq-roles h2 span { display: inline-flex; gap: .4rem; align-items: center; }
  pre.docs { white-space: pre-wrap; font-size: .84rem; }
  @media (max-width: 860px) {
    .aq-cols { grid-template-columns: 1fr; }
    .readings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rh-top .app-chip.ok, .rh-top form.inline { display: none; }
    .rh-main { padding: .8rem .8rem 4.5rem; }
  }
</style>
</head>
<body class="rh">
{{{ topbar }}}
<div class="rh-shell">
  <nav class="rh-rail">{{{ nav }}}</nav>
  <main class="rh-main">{{{ body }}}</main>
</div>
{{{ notifications }}}
</body>
</html>
